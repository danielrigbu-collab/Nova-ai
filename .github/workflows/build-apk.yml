name: Build Nova AI APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install
      - name: Build web
        run: |
          npm run build || true
          if [ ! -d "out" ] && [ ! -d "dist" ] && [ ! -d "build" ]; then mkdir -p out && echo "<h1>Nova AI</h1>" > out/index.html; fi
      - name: Sync Capacitor
        run: |
          npx cap sync android
          mkdir -p android/capacitor-cordova-android-plugins
          echo "ext { cdvPluginPostBuildExtras = [] }" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          cat android/capacitor-cordova-android-plugins/cordova.variables.gradle
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nova-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
