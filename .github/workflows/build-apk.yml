name: Build DevCraft APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: FORCE Rename to DevCraft AI
        run: |
          echo "Before:"
          cat android/app/src/main/res/values/strings.xml
          sed -i 's/Nova AI/DevCraft AI/g' android/app/src/main/res/values/strings.xml
          sed -i 's/>Nova</>DevCraft AI</g' android/app/src/main/res/values/strings.xml || true
          echo "After:"
          cat android/app/src/main/res/values/strings.xml

      - name: Build Android
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: devcraft-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
