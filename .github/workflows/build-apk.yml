name: Build DevCraft APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: FORCE Rename to DevCraft AI
        run: |
          cat android/app/src/main/res/values/strings.xml
          sed -i 's/Nova AI/DevCraft AI/g' android/app/src/main/res/values/strings.xml
          cat android/app/src/main/res/values/strings.xml

      - name: Build Android
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevCraft-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
