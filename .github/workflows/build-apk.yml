name: Build Nova AI APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install
      - name: Build web
        run: |
          npm run build || npx next build || echo "build done"
          ls -la
          mkdir -p public || true
          if [ -d "out" ]; then echo "out exists"; else mkdir -p out && echo "<h1>Nova AI</h1>" > out/index.html; fi
      - name: Sync Capacitor
        run: |
          npx cap sync android
          mkdir -p android/capacitor-cordova-android-plugins
          echo "ext { }" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          ls android/capacitor-cordova-android-plugins/
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nova-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
