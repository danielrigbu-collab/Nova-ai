name: Build DevCraft APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      - name: Build web
        run: npm run build
        env:
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY }}
          NEXT_PUBLIC_GEMINI_KEY_2: ${{ secrets.NEXT_PUBLIC_GEMINI_KEY_2 }}
          NEXT_PUBLIC_GEMINI_KEY_3: ${{ secrets.NEXT_PUBLIC_GEMINI_KEY_3 }}

      - name: Sync Capacitor
        run: |
          rm -rf android/app/src/main/assets/public
          npx cap copy android
          npx cap sync android

      - name: FORCE Rename to DevCraft AI
        run: |
          sed -i 's/Nova AI/DevCraft AI/g' android/app/src/main/res/values/strings.xml
          cat android/app/src/main/res/values/strings.xml

      - name: Build Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevCraft-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
